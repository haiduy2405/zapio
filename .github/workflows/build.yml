name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the Android scaffold (gradle files, icons, styles).
      # Existing files (lib/, MainActivity.kt, AndroidManifest.xml) are kept.
      - name: Create platform scaffold
        run: flutter create --project-name zapio --org com.duyluma --platforms android .

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zapio-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zapio-apk
          path: zapio-build-${{ github.run_number }}.apk

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zapio test build ${{ github.run_number }}
          prerelease: true
          body: |
            Test APK built from ${{ github.sha }}.
            Install on Android: download the .apk below, allow "install unknown apps" for your browser.
          files: zapio-build-${{ github.run_number }}.apk

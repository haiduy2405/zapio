name: zapio
description: "Zapio – TV & AC Remote (Wi-Fi + IR)."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#121214"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#09090B"
  image: assets/icon/splash.png
  android_12:
    color: "#09090B"
    image: assets/icon/splash.png
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/irdb/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Light.ttf
          weight: 300
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
